name: 'Safer Runner Action'
description: 'L7 egress control for GitHub-hosted runners: hostname (SNI/Host) allowlisting through a TLS-terminating proxy'
author: 'PortSwigger'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  mode:
    description: >-
      "analyze": all HTTP(S) goes through the proxy and is logged; nothing is blocked
      (hosts that would be blocked are passed through by SNI and reported).
      "enforce": only allowlisted hostnames are reachable; all other egress is rejected.
    required: false
    default: 'analyze'
  allowed-domains:
    description: >-
      Hostnames to allow in addition to GitHub's own (space/comma/newline separated), for both
      the proxy and DNS. `example.com` allows exactly that name (NOT its subdomains - changed in
      v2.0.0-beta.5); `*.example.com` its subdomains only; `.example.com` both;
      `a-*.example.com` matches within one label. Shared multi-tenant suffixes (e.g.
      blob.core.windows.net) are refused.
    required: false
    default: ''
  passthrough-domains:
    description: >-
      Hostnames whose TLS is NOT decrypted (SNI-only check, upstream still repointed by name).
      Only for single-tenant hosts whose clients cannot trust the runtime CA (e.g. pinned
      clients). hosted-compute-*.githubapp.com is always included (the runner's Go agent
      cannot trust a CA added after boot).
    required: false
    default: 'hosted-compute-*.githubapp.com'
  block-risky-github-subdomains:
    description: 'Deny gist.github.com, gist.githubusercontent.com and raw.githubusercontent.com even though *.github.com is allowed.'
    required: false
    default: 'true'
  dns-servers:
    description: >-
      Upstream DNS servers the resolver (CoreDNS) forwards allowlisted names to: IP addresses,
      space/comma/newline separated. The first is the primary; the rest are tried in order after
      it. Empty falls back to the default (Quad9).
    required: false
    default: '9.9.9.9 149.112.112.112'
  disable-sudo:
    description: >-
      Remove sudo from the runner user after setup. Default: ON in enforce mode (with sudo any
      step can remove the egress controls), off in analyze mode. Set `false` to keep sudo in
      enforce: the job then runs as "enforce (ADVISORY)" - the controls are applied but are not
      an enforced boundary. Deliberately has no default here: unset and `false` differ.
    required: false
  docker:
    description: >-
      Docker access for the runner user (docker is root-equivalent: a step can use it to remove
      the egress controls). "keep": leave docker as it is. "remove-group": remove the runner
      user from the docker group and lock the socket to root. "stop": stop and disable the
      docker daemon. Default: "remove-group" in enforce mode, "keep" in analyze. In enforce,
      "keep" makes the job "enforce (ADVISORY)", and a removal that does not take effect
      (verified on the runner) fails the job. Deliberately has no default here: unset differs
      from an explicit value.
    required: false
  fail-on-tampering:
    description: >-
      Fail the job in the post step if the security configuration changed during the job.
      Default: ON in enforce mode (a subverted control should fail the job), off in analyze
      (analyze never breaks a build). Deliberately has no default here: unset and `false` differ.
    required: false

runs:
  using: 'node24'
  pre: 'dist/pre/index.js'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
