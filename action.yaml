name: 'Safer Runner Action'
description: 'L7 egress control for GitHub-hosted runners: hostname (SNI/Host) allowlisting through a TLS-terminating proxy'
author: 'PortSwigger'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  mode:
    description: >-
      "analyze": all HTTP(S) goes through the proxy and is logged; nothing is blocked
      (hosts that would be blocked are passed through by SNI and reported).
      "enforce": only allowlisted hostnames are reachable; all other egress is rejected.
    required: false
    default: 'analyze'
  allowed-domains:
    description: >-
      Hostnames to allow in addition to GitHub's own (space/comma/newline separated).
      `example.com` allows it and its subdomains; `*.example.com` subdomains only;
      `a-*.example.com` matches within one label. Shared multi-tenant suffixes (e.g.
      blob.core.windows.net) are refused.
    required: false
    default: ''
  passthrough-domains:
    description: >-
      Hostnames whose TLS is NOT decrypted (SNI-only check, upstream still repointed by name).
      Only for single-tenant hosts whose clients cannot trust the runtime CA (e.g. pinned
      clients). hosted-compute-*.githubapp.com is always included (the runner's Go agent
      cannot trust a CA added after boot).
    required: false
    default: 'hosted-compute-*.githubapp.com'
  block-risky-github-subdomains:
    description: 'Deny gist.github.com, gist.githubusercontent.com and raw.githubusercontent.com even though github.com is allowed.'
    required: false
    default: 'true'
  primary-dns-server:
    description: 'Upstream DNS server dnsmasq forwards to (defaults to Quad9).'
    required: false
    default: '9.9.9.9'
  secondary-dns-server:
    description: 'Secondary upstream DNS server ("" to disable).'
    required: false
    default: '149.112.112.112'
  disable-sudo:
    description: >-
      Remove sudo from the runner user after setup. Default: ON in enforce mode (with sudo any
      step can remove the egress controls), off in analyze mode. Set `false` to keep sudo in
      enforce: the job then runs as "enforce (ADVISORY)" - the controls are applied but are not
      an enforced boundary. Deliberately has no default here: unset and `false` differ.
    required: false
  sudo-config:
    description: >-
      Custom sudoers rules for the runner user (ignored when disable-sudo is true). Setting it
      keeps sudo in enforce mode unless disable-sudo is also set, and the job is labelled ADVISORY.
    required: false
    default: ''
  disable-docker:
    description: >-
      Remove the runner user from the docker group (docker access is root-equivalent: a step can
      use it to remove the egress controls). Default: ON in enforce mode, off in analyze. Set
      `false` to keep docker in enforce; the job summary then warns that docker was retained.
      Deliberately has no default here: unset and `false` differ.
    required: false
  stop-docker:
    description: 'Stop and disable the Docker service entirely.'
    required: false
    default: 'false'
  fail-on-tampering:
    description: 'Fail the job in the post step if security configuration was changed during the job.'
    required: false
    default: 'false'
  proxy-port:
    description: '(advanced) Loopback port the proxy listens on.'
    required: false
    default: '8080'
  proxy-stream-large-bodies:
    description: '(advanced) Bodies larger than this are streamed instead of buffered (mitmproxy stream_large_bodies).'
    required: false
    default: '1m'

runs:
  using: 'node24'
  pre: 'dist/pre/index.js'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
