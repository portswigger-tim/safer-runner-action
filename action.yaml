name: 'Safer Runner Action'
description: 'L7 egress control for GitHub-hosted runners: hostname (SNI/Host) allowlisting through a TLS-terminating proxy'
author: 'PortSwigger'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  mode:
    description: >-
      "analyze": all HTTP(S) goes through the proxy and is logged; nothing is blocked
      (hosts that would be blocked are passed through by SNI and reported).
      "enforce": only allowlisted hostnames are reachable; all other egress is rejected.
    required: false
    default: 'analyze'
  allowed-domains:
    description: >-
      Hostnames to allow in addition to GitHub's own (space/comma/newline separated), for both
      the proxy and DNS. `example.com` allows exactly that name (NOT its subdomains - changed in
      v2.0.0-beta.5); `*.example.com` its subdomains only; `.example.com` both;
      `a-*.example.com` matches within one label. Shared multi-tenant suffixes (e.g.
      blob.core.windows.net) are refused.
    required: false
    default: ''
  passthrough-domains:
    description: >-
      Hostnames whose TLS is NOT decrypted (SNI-only check, upstream still repointed by name).
      Only for single-tenant hosts whose clients cannot trust the runtime CA (e.g. pinned
      clients). hosted-compute-*.githubapp.com is always included (the runner's Go agent
      cannot trust a CA added after boot).
    required: false
    default: 'hosted-compute-*.githubapp.com'
  block-risky-github-subdomains:
    description: 'Deny gist.github.com, gist.githubusercontent.com and raw.githubusercontent.com even though *.github.com is allowed.'
    required: false
    default: 'true'
  dns-servers:
    description: >-
      Upstream DNS servers the resolver (CoreDNS) forwards allowlisted names to: IP addresses,
      space/comma/newline separated. The first is the primary; the rest are tried in order after
      it. Empty falls back to the default (Quad9).
    required: false
    default: '9.9.9.9 149.112.112.112'
  http-filter:
    description: >-
      Method + path filtering on hosts that are already allowed (intercepted HTTPS and plain
      HTTP only; passthrough hosts cannot be filtered). A YAML map of host -> { path pattern ->
      methods }, e.g. `registry.npmjs.org: { "*": GET, HEAD }` makes npm read-only. Naming a host
      makes it default-deny: a request is allowed only if a path rule matches and lists its
      method; the most specific path wins. Methods: a comma list, `*`/`ALL` for any, `NONE` to
      deny the path. Paths use the allowed-domains `*` with `/` in the role of `.` (a lone `*`
      segment spans any depth); the query string is ignored, and a request is allowed only if
      every equivalent spelling of its path is (`;params`, repeated and trailing slashes). On
      github.com, paths match case-insensitively and with or without `.git`
      (`org/app/git-receive-pack` also matches `/Org/app.git/git-receive-pack`). It never grants access: a host not
      in allowed-domains stays unreachable. The value is strict YAML (or JSON): a duplicate host or
      path, or any other shape, fails the step; put a key or value that starts with `*` in quotes.
      See docs/DESIGN-L7-path-method.md.
    required: false
    default: ''
  allow-github-platform:
    description: >-
      When a filtered host (http-filter) is one the GitHub Actions platform uses, also allow the
      platform's own endpoints there - an explicit, built-in list of host + path + method, never
      a blanket read rule. The job's control plane (step logs and status, job lease and
      completion, OIDC) is always allowed; artifact and cache endpoints only where none of your
      rules for that host matches the request, so your own rules win there. Set `false` for a
      hard lockdown and allowlist those endpoints by hand.
    required: false
    default: 'true'
  disable-sudo:
    description: >-
      Whether the runner user's sudo is removed after setup (with sudo any step could remove the
      egress controls). Unset or `true`: `enforce` removes it; `analyze` never changes sudo, it
      reports the sudo commands enforce would block and suggests a `sudo-config`. `false` keeps
      sudo, which makes `enforce` "enforce (ADVISORY)" - the controls are applied but are not an
      enforced boundary.
    required: false
  sudo-config:
    description: >-
      With sudo removed (`disable-sudo`), the exact sudo command lines the job may still run as
      root, as a YAML list: `- /usr/bin/apt-get update`. Each is an absolute path and its exact
      arguments; a lone trailing `*` allows one or more further arguments (including options).
      Only letters, digits and `_ . / @ + -`. Any entry makes `enforce` ADVISORY: a command that
      can run code or write files gives the job root. `analyze` lists what this would block and
      suggests a sudo-config from the job's sudo use. Not valid with `disable-sudo: false`.
    required: false
  docker:
    description: >-
      Docker access for the runner user (docker is root-equivalent: a step can use it to remove
      the egress controls). "remove-group" (unset): remove the runner user from the docker group
      and lock the socket to root. "stop": stop and disable the docker daemon. "keep": leave
      docker as it is, which makes `enforce` "enforce (ADVISORY)". `enforce` applies it, and a
      removal that does not take effect (verified on the runner) fails the job; `analyze` never
      changes docker.
    required: false
  fail-on-tampering:
    description: >-
      Override whether the post step fails the job when the security configuration changed during
      the job. `enforce` fails it (a subverted control should fail the job); `analyze` never
      breaks a build. Leave unset to follow the mode (unset and `false` are not the same).
      The check runs in the post step, from files the job's own steps can modify, so it is an
      advisory tripwire rather than tamper-proof assurance.
    required: false

runs:
  using: 'node24'
  pre: 'dist/pre/index.js'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
