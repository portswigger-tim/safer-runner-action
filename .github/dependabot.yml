# Weekly, grouped dependency updates so pinned versions don't rot.
#
# - Dependabot reads this file from the DEFAULT branch (main) only.
# - npm updates change the bundled dist/: CI fails on the PR until someone runs
#   `npm run package` and commits dist/. That is intended - review the bundle diff.
# - github-actions updates keep the full-SHA pins (and their `# vX.Y.Z` comments) current.
# - cooldown: don't propose a release until it has been public for a week, so a compromised
#   upstream release has time to be caught and yanked before it reaches a PR here.
# - groups cover minor/patch only, so a major arrives as its own PR (grouping a major with
#   minors produces an unmergeable PR). Majors that need a migration are ignored here and
#   tracked as issues: @actions/core / @actions/exec (3.x = ESM-only; the build/test toolchain
#   is CJS). Native TypeScript is tracked via @typescript/native; the typescript alias stays
#   on the TS6 compatibility API used by ts-jest.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # 3.x is ESM-only; our build/test toolchain is CommonJS (tracked as an issue).
      - dependency-name: "@actions/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@actions/exec"
        update-types: ["version-update:semver-major"]
      # Keep Jest's JavaScript compiler API on TS6; update the native compiler separately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
