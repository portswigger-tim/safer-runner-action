name: verify-lockfile

# Fails when .github/workflows/actions.lock is out of sync with the workflows, or a locked pin
# no longer verifies upstream (moved tag, rewritten history). See:
# https://github.com/github/gh-actions-lock and
# https://github.blog/changelog/2026-10-28-github-actions-workflow-lockfiles-are-generally-available/

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
